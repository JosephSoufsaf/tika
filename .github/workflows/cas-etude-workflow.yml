name: Tache 2 - tests MimeType

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build tika-core and its dependencies
        run: mvn -B -pl tika-core -am install -DskipTests

      - name: Run the new tests (ChatUniTest + manual)
        run: mvn -B -pl tika-core test -Dtest="MimeType_*_Test" -Dsurefire.failIfNoSpecifiedTests=false
