<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mémé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #3893e2;
    }

    .hidden { display: none !important; }

    #enter {
      position: fixed;
      inset: 0;
      width: 100%;
      border: 0;
      padding: 0;
      background: #3893e2;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    #enter img {
      width: min(70vw, 500px);
      height: auto;
      transition: transform 0.2s;
    }

    #enter:hover img { transform: scale(1.05); }

    #meme { position: fixed; inset: 0; }

    #image {
      display: block;
      width: 100%;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
    }

    /* paroles: Garamond, grandes, avec marge à gauche */
    #legende {
      position: absolute;
      left: clamp(1.5rem, 5vw, 4rem);
      bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      margin: 0;
      max-width: 85vw;
      color: #fff;
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
      font-size: clamp(1.6rem, 4vw, 3.2rem);
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      pointer-events: none;
    }

    /* signature: police normale, plus petite que les paroles */
    #signature {
      display: block;
      margin-top: 0.6em;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 0.4em;
      line-height: 1.3;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <button id="enter" aria-label="Voir le résultat">
    <img src="bear.png" alt="Ours de Graduation avec lunettes">
  </button>

  <div id="meme" class="hidden">
    <picture>
      <source media="(min-aspect-ratio: 21/10)"
              srcset="ultrawide_3440x1440.png">

      <source media="(min-aspect-ratio: 17/10)"
              srcset="desktop_1920x1080.png 1920w,
                      desktop_2560x1440.png 2560w"
              sizes="100vw">

      <source media="(min-aspect-ratio: 5/4)"
              srcset="macbook_2560x1600.png">

      <source media="(min-aspect-ratio: 6/10)"
              srcset="ipad_2048x2732.png">

      <source media="(min-aspect-ratio: 4/10)"
              srcset="android_1080x2400.png 1080w,
                      iphone_1179x2556.png 1179w"
              sizes="100vw">

      <img id="image" src="meme.jpg"
           alt="Pepe the frog en pochette de Graduation">
    </picture>
    <p id="legende">
      A red CI makes you stronger<br>
      Failed tests? Vulnerabilities? Fix it, push it, merge it harder<br>
      <span id="signature">— DJ SOUF &amp; DJ THANG ft. Kanye West</span>
    </p>
  </div>

  <audio id="son" src="meme.mp3" preload="auto" loop></audio>

  <script>
    const son = document.getElementById("son");
    const enter = document.getElementById("enter");
    const meme = document.getElementById("meme");

    enter.addEventListener("click", () => {
      son.play().catch(err => console.error("audio:", err));
      enter.classList.add("hidden");
      meme.classList.remove("hidden");
    });
  </script>
</body>
</html>
