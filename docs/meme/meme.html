<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mémé</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #3b1a7a;
      }

      .hidden { display: none; }

      #enter {
        position: fixed;
        inset: 0;
        width: 100%;
        font-size: 2rem;
        cursor: pointer;
      }

      #meme { position: fixed; inset: 0; }

      #image {
        display: block;
        width: 100%;
        height: 100dvh;
        object-fit: cover;
        object-position: 30% 20%;
      }
    </style>
</head>
<body>
  <button id="enter">Votre build a échoué. Cliquez pour obtenir de la motivation.</button>

  <div id="meme" class="hidden">
    <img src="meme.jpg" alt="pepe the frog as graduation album cover">
  </div>

  <audio id="son" src="meme.mp3" preload="auto" loop></audio>

  <script>
    const son = document.getElementById("son");
    document.getElementById("enter").addEventListener("click", () => {
      son.play();                       // doit être appelé directement dans le clic
      document.getElementById("enter").classList.add("hidden");
      document.getElementById("meme").classList.remove("hidden");
    });
  </script>
</body>
</html>
